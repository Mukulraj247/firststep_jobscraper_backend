server {
    listen 80;
    # Replace with your ScoutX hostname once DNS points at this droplet.
    server_name scoutx-dev.firststepjob.com;

    root /var/www/maxun;
    index index.html;

    # Serve the frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy for backend (API process on localhost when using PM2 on the droplet)
    location  ~ ^/(auth|storage|record|workflow|robot|proxy|api-docs|api|webhook|socket.io)(/|$) {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
