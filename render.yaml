# Render Blueprint for Scout-X (Optimized for Render Free Tier)
# See docs/render-deployment.md for full details.

services:
  # 1. Frontend Web App (Static Site)
  - type: web
    name: scout-x-frontend
    runtime: static
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: build
    envVars:
      - key: VITE_BACKEND_URL
        sync: false
      - key: VITE_PUBLIC_URL
        sync: false

  # 2. Backend Web Service (Express API + Socket.IO + Embedded Scraper Workers)
  - type: web
    name: scout-x-backend
    runtime: node
    plan: free
    # Override NODE_OPTIONS during build — the service env caps Node at 192MB for
    # runtime (so Chromium fits), but tsc needs more heap than that to compile.
    buildCommand: NODE_OPTIONS='--max-old-space-size=768' npm ci --include=dev && NODE_OPTIONS='--max-old-space-size=768' npm run build:server && PLAYWRIGHT_BROWSERS_PATH=/opt/render/project/.pw-browsers npx -y playwright@1.58.0 install chromium
    startCommand: npm run server
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: BACKEND_URL
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: VITE_BACKEND_URL
        sync: false
      - key: VITE_PUBLIC_URL
        sync: false
      - key: RUN_EMBEDDED_WORKERS
        value: "true"
      - key: SCRAPER_WORKER_CONCURRENCY
        value: "1"
      - key: SCRAPER_JOB_TIMEOUT_MS
        value: "45000"
      # CRITICAL: Chromium is OUTSIDE the V8 heap but still counts against Render's
      # 512MB container limit. Cap Node ~192MB so Chromium has room to launch.
      # (A 460MB Node heap left almost no room and caused OOM restarts.)
      - key: NODE_OPTIONS
        value: "--max-old-space-size=192 --expose-gc"
      - key: LOW_MEMORY_MODE
        value: "true"
      # One attempt only on free — a retry often means a second Chromium spike.
      - key: SCRAPER_MAX_ATTEMPTS
        value: "1"
      - key: DISABLE_VISIBLE_BROWSER_RETRY
        value: "true"
      - key: BROWSER_POOL_MAX_PAGES
        value: "1"
      - key: BROWSER_POOL_IDLE_TTL_MS
        value: "0"
      # Trim anti-bot waits so a single challenge can't exceed the job timeout.
      - key: CLOUDFLARE_WAIT_TIMEOUT_MS
        value: "20000"
      - key: AMAZON_CHALLENGE_WAIT_MS
        value: "25000"
      - key: MICROSOFT_CHALLENGE_WAIT_MS
        value: "25000"
      # Reduce idle DB traffic and cap socket payload size on the small instance.
      - key: QUEUED_RUNS_POLL_MS
        value: "60000"
      - key: SOCKET_MAX_HTTP_BUFFER_BYTES
        value: "2097152"
      - key: LOGS_PATH
        value: server/logs
